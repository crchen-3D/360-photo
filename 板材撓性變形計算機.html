<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>板材撓性與變形量計算機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6 lg:px-8 flex justify-center items-start">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden transition-all">
        
        <!-- Header Banner -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 px-8 py-6 text-white">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">板材撓性變形計算機</h1>
                    <p class="text-blue-100 mt-2 text-sm sm:text-base">支援異質主板、鈑金成型補強肋 (矩形/垂直I型/倒L型) 與搭接無固定狀態的簡支樑中央受力模型</p>
                </div>
                <div class="hidden sm:block p-3 bg-white/20 rounded-lg backdrop-blur-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                </div>
            </div>
        </div>

        <div class="p-8">
            <!-- Error Notification Box -->
            <div id="errorBox" class="hidden mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-md shadow-sm">
                <div class="flex items-center">
                    <svg class="h-5 w-5 text-red-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <p id="errorMessage" class="text-sm text-red-700 font-medium"></p>
                </div>
            </div>

            <form id="calcForm" class="space-y-6" onsubmit="event.preventDefault();">
                
                <!-- Section 1: Load Conditions -->
                <section class="bg-gray-50 p-4 rounded-xl border border-gray-100 flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-6">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center whitespace-nowrap">
                        <span class="bg-orange-100 text-orange-700 rounded-full w-7 h-7 flex items-center justify-center mr-2 text-sm">1</span>
                        受力條件
                    </h2>
                    <div class="flex items-center space-x-3 flex-1 sm:max-w-md">
                        <label class="text-sm font-medium text-gray-700 whitespace-nowrap">中央集中載重 (P) <span class="text-gray-400 text-xs font-normal">kg</span></label>
                        <input type="number" id="load" value="20" step="any" oninput="calculateDeflection()" class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 text-xl font-semibold transition-shadow" required>
                    </div>
                </section>

                <!-- Section 2: Main Plate Settings -->
                <section class="bg-gray-50 p-5 rounded-xl border border-gray-100">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 pb-3 border-b border-gray-200">
                        <h2 class="text-lg font-bold text-gray-800 flex items-center">
                            <span class="bg-blue-100 text-blue-700 rounded-full w-7 h-7 flex items-center justify-center mr-2 text-sm">2</span>
                            主板材設定
                        </h2>
                        <label class="mt-2 sm:mt-0 flex items-center space-x-2 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-200 cursor-pointer hover:bg-blue-100 transition-colors">
                            <input type="checkbox" id="include_plate" checked onchange="togglePlateInputs()" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
                            <span class="text-sm font-semibold text-blue-900">計入主板材計算</span>
                        </label>
                    </div>

                    <div class="grid grid-cols-12 gap-4 transition-all">
                        <div class="col-span-12 sm:col-span-5 space-y-1">
                            <label class="text-sm font-medium text-gray-700">主板材料種類</label>
                            <select id="material_plate" onchange="calculateDeflection()" class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow cursor-pointer">
                                <option value="69000">鋁合金 (E = 69 GPa)</option>
                                <option value="200000">鐵 / 碳鋼 (E = 200 GPa)</option>
                                <option value="193000">不鏽鋼 (E = 193 GPa)</option>
                                <option value="3500">MDF 木板 (E = 3.5 GPa)</option>
                                <option value="2500">塑合板/刨花板 (E = 2.5 GPa)</option>
                            </select>
                        </div>
                        <div class="col-span-6 sm:col-span-3 space-y-1">
                            <label class="text-sm font-medium text-gray-700">長度 (跨距) <span class="text-gray-400 text-xs font-normal">mm</span></label>
                            <input type="number" id="length" value="460" step="any" oninput="calculateDeflection()" class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow" required>
                        </div>
                        <div class="col-span-6 sm:col-span-2 space-y-1">
                            <label class="text-sm font-medium text-gray-700">主板寬度 <span class="text-gray-400 text-xs font-normal">mm</span></label>
                            <input type="number" id="width" value="230" step="any" oninput="calculateDeflection()" class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow" required>
                        </div>
                        <div class="col-span-12 sm:col-span-2 space-y-1">
                            <label class="text-sm font-medium text-gray-700">厚度 <span class="text-gray-400 text-xs font-normal">mm</span></label>
                            <input type="number" id="t_plate" value="5" step="any" oninput="calculateDeflection()" class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow" required>
                        </div>
                    </div>
                </section>

                <!-- Section 3: Ribs Settings -->
                <section class="bg-gray-50 p-5 rounded-xl border border-gray-100">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 pb-3 border-b border-gray-200">
                        <h2 class="text-lg font-bold text-gray-800 flex items-center">
                            <span class="bg-indigo-100 text-indigo-700 rounded-full w-7 h-7 flex items-center justify-center mr-2 text-sm">3</span>
                            補強肋 (Ribs) 設定
                        </h2>
                        <div class="mt-2 sm:mt-0 flex items-center space-x-4 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-200">
                            <span class="text-sm font-semibold text-indigo-900">是否配置補強肋:</span>
                            <label class="flex items-center space-x-1 cursor-pointer">
                                <input type="radio" name="has_ribs" value="yes" checked onchange="toggleRibsInputs()" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                                <span class="text-sm text-indigo-900 font-medium">有</span>
                            </label>
                            <label class="flex items-center space-x-1 cursor-pointer">
                                <input type="radio" name="has_ribs" value="no" onchange="toggleRibsInputs()" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                                <span class="text-sm text-indigo-900 font-medium">無</span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Ribs Container to toggle -->
                    <div id="ribs_container" class="space-y-4 transition-all">
                        <!-- Ribs Material Selection -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-sm font-medium text-gray-700">補強肋材料種類</label>
                                <select id="material_rib" onchange="calculateDeflection()" class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow cursor-pointer">
                                    <option value="69000">鋁合金 (E = 69 GPa)</option>
                                    <option value="200000">鐵 / 碳鋼 (E = 200 GPa)</option>
                                    <option value="193000">不鏽鋼 (E = 193 GPa)</option>
                                    <option value="3500">MDF 木板 (E = 3.5 GPa)</option>
                                    <option value="2500">塑合板/刨花板 (E = 2.5 GPa)</option>
                                </select>
                            </div>
                            <div class="space-y-1">
                                <label class="text-sm font-medium text-gray-700">鈑金成型斷面形狀</label>
                                <select id="rib_profile" onchange="toggleProfileInputs(); calculateDeflection();" class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow cursor-pointer">
                                    <option value="plate">I型 (片狀垂直)</option>
                                    <option value="l_shape">倒L型 (1垂直+1水平)</option>
                                    <option value="u_shape">U型 (2垂直+1底部水平)</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <div class="space-y-1">
                                <label class="text-sm font-medium text-gray-700">肋高度 <span class="text-gray-400 text-xs">mm</span></label>
                                <input type="number" id="rib_h" value="10" step="any" oninput="calculateDeflection()" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition-shadow" required>
                            </div>
                            <div class="space-y-1">
                                <label class="text-sm font-medium text-gray-700">肋厚度 <span class="text-gray-400 text-xs">mm</span></label>
                                <input type="number" id="rib_t" value="5" step="any" oninput="calculateDeflection()" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition-shadow" required>
                            </div>
                            <div class="space-y-1">
                                <label class="text-sm font-medium text-gray-700">肋數量 <span class="text-gray-400 text-xs">條</span></label>
                                <input type="number" id="rib_n" value="4" step="1" min="1" oninput="calculateDeflection()" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition-shadow" required>
                            </div>
                            <div class="space-y-1">
                                <label class="text-sm font-medium text-gray-700">水平寬度 <span class="text-gray-400 text-xs">mm</span></label>
                                <input type="number" id="flange_w" value="15" step="any" oninput="calculateDeflection()" class="w-full px-3 py-2 bg-gray-100 text-gray-400 border border-gray-300 rounded-lg cursor-not-allowed focus:outline-none transition-shadow" required disabled>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Joint Type Selection -->
                    <div id="joint_section" class="space-y-2 pt-3 mt-3 border-t border-gray-200 transition-all">
                        <label class="text-sm font-medium text-gray-700 block">補強肋結合方式與傳遞效率</label>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            <label class="flex items-center p-2.5 bg-white border border-gray-300 rounded-lg cursor-pointer hover:bg-indigo-50 focus-within:ring-2 focus-within:ring-indigo-500 transition-colors">
                                <input type="radio" name="joint_type" value="1.0" onchange="calculateDeflection()" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                                <span class="ml-2 text-xs sm:text-sm text-indigo-900 font-medium">一體成型 <span class="text-indigo-900 font-bold block">(100%)</span></span>
                            </label>
                            <label class="flex items-center p-2.5 bg-white border border-gray-300 rounded-lg cursor-pointer hover:bg-indigo-50 focus-within:ring-2 focus-within:ring-indigo-500 transition-colors">
                                <input type="radio" name="joint_type" value="0.8" onchange="calculateDeflection()" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                                <span class="ml-2 text-xs sm:text-sm text-indigo-900 font-medium">點焊 / 鎖固 <span class="text-indigo-900 font-bold block">(80%)</span></span>
                            </label>
                            <label class="flex items-center p-2.5 bg-white border border-gray-300 rounded-lg cursor-pointer hover:bg-indigo-50 focus-within:ring-2 focus-within:ring-indigo-500 transition-colors">
                                <input type="radio" name="joint_type" value="loose" onchange="calculateDeflection()" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500" checked>
                                <span class="ml-2 text-xs sm:text-sm text-amber-900 font-medium">搭接 / 僅放置 <span class="text-amber-700 font-bold block">(獨立受力)</span></span>
                            </label>
                        </div>
                    </div>
                </section>
            </form>

            <!-- Results Section -->
            <div id="resultBox" class="mt-8 transform transition-all duration-500 opacity-100">
                <div class="relative bg-white border-2 border-indigo-100 rounded-2xl p-6 shadow-sm overflow-hidden">
                    <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-indigo-50 rounded-full opacity-50"></div>
                    
                    <h3 class="text-xl font-bold text-gray-800 border-b border-gray-100 pb-3 mb-4 flex items-center">
                        <svg class="w-6 h-6 text-indigo-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        計算分析結果
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="bg-indigo-50 rounded-xl p-6 flex flex-col justify-center items-center text-center">
                            <span id="res_mode_label" class="text-indigo-800 font-semibold mb-2">中心最大下沉量 (撓度)</span>
                            <div class="flex items-baseline justify-center">
                                <span id="res_deflection" class="text-5xl font-extrabold text-indigo-600 tracking-tight">0</span>
                                <span class="text-lg text-indigo-500 font-semibold ml-2">mm</span>
                            </div>
                            <p id="res_desc" class="text-xs text-indigo-400 mt-3 max-w-xs">基於簡支樑彈性變形公式推算，數值越小代表結構越堅固。</p>
                        </div>
                        
                        <div class="space-y-4 justify-center flex flex-col">
                            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                                <span class="text-sm text-gray-600 font-medium">總截面積 (A)</span>
                                <div class="font-mono text-gray-900 font-semibold text-right">
                                    <span id="res_area">0</span> <span class="text-xs text-gray-500">mm²</span>
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                                <span class="text-sm text-gray-600 font-medium">中性軸高度 (ȳ)</span>
                                <div class="font-mono text-gray-900 font-semibold text-right">
                                    <span id="res_ybar">0</span> <span class="text-xs text-gray-500">mm</span>
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                                <span class="text-sm text-gray-600 font-medium">抗彎剛度 (E × I)</span>
                                <div class="font-mono text-gray-900 font-semibold text-right">
                                    <span id="res_inertia">0</span> <span class="text-xs text-gray-500">N·mm²</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePlateInputs() {
            calculateDeflection();
        }

        function toggleRibsInputs() {
            const hasRibsRadio = document.querySelector('input[name="has_ribs"]:checked');
            const ribsContainer = document.getElementById('ribs_container');
            const jointSection = document.getElementById('joint_section');
            
            if (hasRibsRadio && hasRibsRadio.value === 'no') {
                ribsContainer.classList.add('opacity-40', 'pointer-events-none');
                jointSection.classList.add('opacity-40', 'pointer-events-none');
            } else {
                ribsContainer.classList.remove('opacity-40', 'pointer-events-none');
                jointSection.classList.remove('opacity-40', 'pointer-events-none');
            }
            calculateDeflection();
        }

        function toggleProfileInputs() {
            const profile = document.getElementById('rib_profile').value;
            const flangeWInput = document.getElementById('flange_w');
            
            if (profile === 'plate') {
                flangeWInput.disabled = true;
                flangeWInput.classList.add('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
                flangeWInput.classList.remove('bg-white', 'focus:ring-2', 'focus:ring-indigo-500');
            } else {
                flangeWInput.disabled = false;
                flangeWInput.classList.remove('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
                flangeWInput.classList.add('bg-white', 'focus:ring-2', 'focus:ring-indigo-500');
            }
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.textContent = message;
            errorBox.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorBox').classList.add('hidden');
        }

        function calculateDeflection() {
            hideError();

            const includePlate = document.getElementById('include_plate').checked;
            const hasRibsRadio = document.querySelector('input[name="has_ribs"]:checked');
            const hasRibs = hasRibsRadio ? hasRibsRadio.value === 'yes' : true;

            const length = parseFloat(document.getElementById('length').value);
            const load_kg = parseFloat(document.getElementById('load').value);
            const width = parseFloat(document.getElementById('width').value) || 0;
            const t_plate = parseFloat(document.getElementById('t_plate').value) || 0;
            
            let rib_h = hasRibs ? (parseFloat(document.getElementById('rib_h').value) || 0) : 0;
            let rib_t = hasRibs ? (parseFloat(document.getElementById('rib_t').value) || 0) : 0;
            let rib_n = hasRibs ? (parseInt(document.getElementById('rib_n').value) || 0) : 0;
            
            if (length <= 0) {
                showError("長度 (跨距) 必須大於 0");
                return;
            }
            if (load_kg < 0) {
                showError("載重不能為負數");
                return;
            }
            if (hasRibs && (rib_h <= 0 || rib_t <= 0 || rib_n <= 0)) {
                showError("補強肋的高度、厚度與數量必須大於 0");
                return;
            }
            if (!includePlate && !hasRibs) {
                showError("必須至少選擇包含「主板材」或「補強肋」其中一項！");
                return;
            }

            const E_plate = parseFloat(document.getElementById('material_plate').value);
            const E_rib = parseFloat(document.getElementById('material_rib').value);
            const profile = document.getElementById('rib_profile').value;
            const flange_w = parseFloat(document.getElementById('flange_w').value) || 0;

            const g = 9.81;
            const P = load_kg * g;

            let total_area = 0;
            let y_bar = 0;
            let equivalent_EI = 0;
            let deflection = 0;

            // --- 計算單根肋在自身形心軸的幾何性質 (基於肋底部 y_local = 0) ---
            let A2_single = 0;
            let y2_local_centroid = 0;
            let I2_single_own = 0;

            if (hasRibs) {
                if (profile === 'plate') {
                    // I型 (片狀垂直)
                    A2_single = rib_t * rib_h;
                    y2_local_centroid = rib_h / 2.0;
                    I2_single_own = (rib_t * Math.pow(rib_h, 3)) / 12.0;
                } else if (profile === 'l_shape') {
                    // 倒L型 (1垂直 + 1水平)
                    const A_web = rib_t * rib_h;
                    const A_flange = flange_w * rib_t;
                    A2_single = A_web + A_flange;
                    
                    y2_local_centroid = (A_web * (rib_h / 2.0) + A_flange * (rib_t / 2.0)) / A2_single;
                    
                    const I_web_own = (rib_t * Math.pow(rib_h, 3)) / 12.0;
                    const d_web = (rib_h / 2.0) - y2_local_centroid;
                    const I_flange_own = (flange_w * Math.pow(rib_t, 3)) / 12.0;
                    const d_flange = (rib_t / 2.0) - y2_local_centroid;
                    
                    I2_single_own = (I_web_own + A_web * Math.pow(d_web, 2)) + (I_flange_own + A_flange * Math.pow(d_flange, 2));
                } else if (profile === 'u_shape') {
                    // U型 (2垂直 + 1底部水平)
                    const A_webs = 2 * (rib_t * rib_h);
                    const A_flange = flange_w * rib_t;
                    A2_single = A_webs + A_flange;
                    
                    y2_local_centroid = (A_webs * (rib_h / 2.0) + A_flange * (rib_t / 2.0)) / A2_single;
                    
                    const I_webs_own = 2 * ((rib_t * Math.pow(rib_h, 3)) / 12.0);
                    const d_webs = (rib_h / 2.0) - y2_local_centroid;
                    const I_flange_own = (flange_w * Math.pow(rib_t, 3)) / 12.0;
                    const d_flange = (rib_t / 2.0) - y2_local_centroid;
                    
                    I2_single_own = (I_webs_own + A_webs * Math.pow(d_webs, 2)) + (I_flange_own + A_flange * Math.pow(d_flange, 2));
                }
            }

            const A2_actual = A2_single * rib_n;
            const I2_own_actual = I2_single_own * rib_n;
            const EI_ribs_independent = E_rib * I2_own_actual;

            const I1_own = (width * Math.pow(t_plate, 3)) / 12.0;
            const EI_plate_independent = E_plate * I1_own;

            if (includePlate && !hasRibs) {
                // 狀況 1：僅有主板材
                if (width <= 0 || t_plate <= 0) {
                    showError("主板的寬度與厚度必須大於 0");
                    return;
                }
                total_area = width * t_plate;
                y_bar = t_plate / 2.0;
                equivalent_EI = EI_plate_independent;
                
                document.getElementById('res_mode_label').innerText = "中心最大下沉量 (僅主板材獨立支撐)";
                document.getElementById('res_desc').innerText = "未配置補強肋，完全由主板材承受集中載重。";
            } else if (!includePlate && hasRibs) {
                // 狀況 2：僅有補強肋
                total_area = A2_actual;
                y_bar = y2_local_centroid;
                equivalent_EI = EI_ribs_independent;
                
                document.getElementById('res_mode_label').innerText = "中心最大下沉量 (僅補強肋獨立支撐)";
                document.getElementById('res_desc').innerText = "未計入主板材，完全由獨立的補強肋承受集中載重。";
            } else {
                // 狀況 3：主板材與補強肋皆有
                if (width <= 0 || t_plate <= 0) {
                    showError("主板的寬度與厚度必須大於 0");
                    return;
                }

                const A1 = width * t_plate;
                total_area = A1 + A2_actual;

                const jointRadios = document.getElementsByName('joint_type');
                let jointValue = "1.0";
                for (let i = 0; i < jointRadios.length; i++) {
                    if (jointRadios[i].checked) {
                        jointValue = jointRadios[i].value;
                        break;
                    }
                }

                if (jointValue === "loose") {
                    // 搭接 (Loose Contact)
                    equivalent_EI = EI_plate_independent + EI_ribs_independent;
                    y_bar = rib_h + (t_plate / 2.0);
                    
                    document.getElementById('res_mode_label').innerText = "中心最大下沉量 (搭接 / 無固定自由接觸)";
                    document.getElementById('res_desc').innerText = "主板與補強肋呈疊放搭接狀態，受力時各自承受分流載重。";
                } else {
                    // 一體成型或點焊/鎖固
                    const joint_efficiency = parseFloat(jointValue);
                    const n = E_rib / E_plate;

                    const y1 = rib_h + (t_plate / 2.0);
                    const A2_transformed = A2_actual * n;
                    const y2 = y2_local_centroid;
                    const I2_own_transformed = I2_own_actual * n;

                    y_bar = (A1 * y1 + A2_transformed * y2) / (A1 + A2_transformed);
                    
                    const I1_total = I1_own + A1 * Math.pow((y1 - y_bar), 2);
                    const I2_total = I2_own_transformed + A2_transformed * Math.pow((y_bar - y2), 2);
                    const I_composite_theoretical = I1_total + I2_total;
                    
                    const structural_gain = I_composite_theoretical - I1_own;
                    const I_effective = I1_own + (structural_gain * joint_efficiency);

                    equivalent_EI = E_plate * I_effective;
                    
                    const modeTitle = joint_efficiency === 1.0 ? "中心最大下沉量 (一體成型複合截面)" : "中心最大下沉量 (點焊/鎖固複合截面)";
                    document.getElementById('res_mode_label').innerText = modeTitle;
                    document.getElementById('res_desc').innerText = "主板與補強肋結合，透過平行軸定理與接合效率共同分擔應力。";
                }
            }

            if (equivalent_EI > 0) {
                deflection = (P * Math.pow(length, 3)) / (48.0 * equivalent_EI);
            } else {
                showError("計算異常：抗彎剛度無法計算");
                return;
            }

            document.getElementById('res_area').innerText = total_area.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 1});
            document.getElementById('res_ybar').innerText = y_bar.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            let inertiaStr = equivalent_EI > 999999999 ? 
                             equivalent_EI.toExponential(2) : 
                             equivalent_EI.toLocaleString(undefined, {maximumFractionDigits: 1});
            document.getElementById('res_inertia').innerText = inertiaStr;
            document.getElementById('res_deflection').innerText = deflection.toFixed(4);
        }

        window.addEventListener('DOMContentLoaded', () => {
            toggleRibsInputs();
            toggleProfileInputs();
        });
    </script>
</body>
</html>
